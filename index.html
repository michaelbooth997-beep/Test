<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #e94560;
      letter-spacing: 2px;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.5rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      line-height: 1;
    }

    .cell .label {
      font-size: 0.55rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.trump .label { color: #e94560; }
    .cell.osama .label { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 14px rgba(233, 69, 96, 0.7);
    }

    #reset {
      margin-top: 2rem;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #reset:hover { background: #c73652; }

    #score {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    #score span { text-align: center; }
    #score strong { display: block; font-size: 1.6rem; color: #eee; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div id="score">
    <span>🎩 Trump Wins<strong id="trumpScore">0</strong></span>
    <span>Draws<strong id="drawScore">0</strong></span>
    <span>🧔 Osama Wins<strong id="osamaScore">0</strong></span>
  </div>

  <div id="status"></div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <button id="reset">New Game</button>

  <script>
    const PLAYERS = {
      T: { emoji: '🎩', name: 'Trump',  cls: 'trump', label: 'Trump' },
      O: { emoji: '🧔', name: 'Osama',  cls: 'osama', label: 'Osama' },
    };

    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const trumpScoreEl = document.getElementById('trumpScore');
    const osamaScoreEl = document.getElementById('osamaScore');
    const drawScoreEl  = document.getElementById('drawScore');

    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board = Array(9).fill('');
    let current = 'T';
    let gameOver = false;
    let score = { T: 0, O: 0, D: 0 };

    function setStatus(msg) { status.textContent = msg; }

    function renderTurn() {
      const p = PLAYERS[current];
      setStatus(`${p.emoji} ${p.name}'s turn`);
    }

    cells.forEach(cell => cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (gameOver || board[i]) return;

      const p = PLAYERS[current];
      board[i] = current;
      cell.innerHTML = `<span>${p.emoji}</span><span class="label">${p.label}</span>`;
      cell.classList.add('taken', p.cls);

      const winLine = getWin();
      if (winLine) {
        winLine.forEach(j => cells[j].classList.add('win'));
        setStatus(`${p.emoji} ${p.name} wins! 🎉`);
        score[current]++;
        updateScore();
        gameOver = true;
      } else if (board.every(v => v)) {
        setStatus("It's a draw! 🤝");
        score.D++;
        updateScore();
        gameOver = true;
      } else {
        current = current === 'T' ? 'O' : 'T';
        renderTurn();
      }
    }));

    document.getElementById('reset').addEventListener('click', reset);

    function getWin() {
      return WINS.find(([a, b, c]) => board[a] && board[a] === board[b] && board[b] === board[c]) || null;
    }

    function updateScore() {
      trumpScoreEl.textContent = score.T;
      osamaScoreEl.textContent = score.O;
      drawScoreEl.textContent  = score.D;
    }

    function reset() {
      board = Array(9).fill('');
      current = 'T';
      gameOver = false;
      cells.forEach(cell => {
        cell.innerHTML = '';
        cell.className = 'cell';
      });
      renderTurn();
    }

    renderTurn();
  </script>
</body>
</html>
